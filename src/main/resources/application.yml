# Settings shared by every profile.
# Database and Redis connections live in the profile files:
#   application-dev.yml   local development (the default profile)
#   application-prod.yml  production: every connection setting must come from the environment
spring:
    application:
        name: auth

    profiles:
        default: dev

    mvc:
        view:
            suffix: .html

    jpa:
        hibernate:
            # Flyway owns the schema (src/main/resources/db/migration).
            # Hibernate only checks that the entities match it.
            ddl-auto: validate
        show-sql: false
        # No persistence context held open for the whole HTTP request. With it on,
        # entities loaded early in a request went stale after later writes, and
        # Hibernate 7 failed when saving them (e.g. email verification returned 500).
        open-in-view: false

    # The mail server (host, port, login) is set per profile: dev sends to Mailpit,
    # prod needs MAIL_HOST, MAIL_PORT, MAIL_USERNAME and MAIL_PASSWORD.
    mail:
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

server:
    port: ${SERVER_PORT:8080}

auth:
    base-url: ${APP_BASE_URL:http://localhost:${server.port}}
    token:
        secret-key: ${JWT_SECRET_KEY}
        jwt-expiration: 10800000
        refresh-expiration: 604800000
        token-expiration: 3600000

    # The refresh-token cookie. Keep the defaults while the frontend runs on the same
    # site as the API (e.g. localhost:3000 -> localhost:8080). For a frontend on another
    # domain, set AUTH_COOKIE_SAME_SITE=None (needs AUTH_COOKIE_SECURE=true and HTTPS).
    # Browsers accept Secure cookies from http://localhost, so secure stays on in dev.
    cookie:
        secure: ${AUTH_COOKIE_SECURE:true}
        same-site: ${AUTH_COOKIE_SAME_SITE:Strict}

    # The sender of every email. MAIL_FROM must be an address your mail provider
    # accepts as a sender (for Amazon SES: a verified address or domain).
    mail:
        from: ${MAIL_FROM}
        from-name: AuthCore

    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:${server.port}}
        allowed-methods:
            - GET
            - POST
        allowed-headers:
            - Authorization
            - Content-Type
