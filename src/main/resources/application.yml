# Settings shared by every profile.
# Database and Redis connections live in the profile files:
#   application-dev.yml   local development (the default profile)
#   application-prod.yml  production: every connection setting must come from the environment
spring:
    application:
        name: auth

    profiles:
        default: dev

    mvc:
        view:
            suffix: .html

    datasource:
        hikari:
            # Each query sees what is committed now. With MySQL's default (REPEATABLE READ), a
            # transaction keeps seeing what was there at its first read, even after waiting
            # for a lock: one verification link could then be used twice at the same moment.
            transaction-isolation: TRANSACTION_READ_COMMITTED

    jpa:
        hibernate:
            # Flyway owns the schema (src/main/resources/db/migration).
            # Hibernate only checks that the entities match it.
            ddl-auto: validate
        show-sql: false
        # No persistence context held open for the whole HTTP request. With it on,
        # entities loaded early in a request went stale after later writes, and
        # Hibernate 7 failed when saving them (e.g. email verification returned 500).
        open-in-view: false

    data:
        redis:
            # Fail after 2 seconds when Redis doesn't answer. The default is a full minute,
            # and every request that uses Redis would hang that long.
            connect-timeout: 2s
            timeout: 2s

    # The mail server (host, port, login) is set per profile: dev sends to Mailpit,
    # prod needs MAIL_HOST, MAIL_PORT, MAIL_USERNAME and MAIL_PASSWORD.
    mail:
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

server:
    port: ${SERVER_PORT:8080}

auth:
    # Where the web app runs. Verification emails link to its /verify-email?token=... page,
    # which must POST the token to /api/v1/auth/email-verification/confirm.
    frontend-url: ${FRONTEND_URL}

    # Comma-separated emails that get the ADMIN role (at registration, and existing
    # users at startup). The API never grants ADMIN. Empty by default.
    admin-emails: ${AUTH_ADMIN_EMAILS:}
    token:
        secret-key: ${JWT_SECRET_KEY}
        # Every access token names its issuer and audience, and is refused if they differ.
        # Give each environment its own, so that their tokens can't be mixed up.
        issuer: ${JWT_ISSUER:authcore}
        audience: ${JWT_AUDIENCE:authcore}
        # 15 minutes. Short, because a stolen access token works until it expires.
        jwt-expiration: 900000
        # A session ends 7 days after it was last used, and 30 days after the login at the latest.
        refresh-expiration: 604800000
        session-expiration: 2592000000

    # The refresh-token cookie. Keep the defaults while the frontend runs on the same
    # site as the API (e.g. localhost:3000 -> localhost:8080). For a frontend on another
    # domain, set AUTH_COOKIE_SAME_SITE=None (needs AUTH_COOKIE_SECURE=true and HTTPS).
    # Browsers accept Secure cookies from http://localhost, so secure stays on in dev.
    cookie:
        secure: ${AUTH_COOKIE_SECURE:true}
        same-site: ${AUTH_COOKIE_SAME_SITE:Strict}

    # The sender of every email. MAIL_FROM must be an address your mail provider
    # accepts as a sender (for Amazon SES: a verified address or domain).
    mail:
        from: ${MAIL_FROM}
        from-name: AuthCore

    # Browser frontends allowed to call the API. Comma-separated exact origins
    # (scheme://host:port), never "*". Defaults: React (3000) and Vite (5173) dev servers.
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
        allowed-methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
        allowed-headers:
            - Authorization
            - Content-Type
