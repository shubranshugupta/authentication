# Local development. Active by default (see spring.profiles.default).
# Values come from, highest priority first: environment variables, ./env.properties
# at the project root (git-ignored), then the defaults below, which match docker-compose.yml.
spring:
    config:
        import: optional:file:./env.properties

    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_DATABASE:auth}
        username: ${DB_USER:auth}
        password: ${DB_PASSWORD:auth}

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}

    # Mailpit from docker-compose.yml: emails show up at http://localhost:8025.
    # It accepts any username and password. To send real emails from dev,
    # set MAIL_HOST, MAIL_PORT, MAIL_USERNAME and MAIL_PASSWORD.
    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}
        username: ${MAIL_USERNAME:dev}
        password: ${MAIL_PASSWORD:dev}

    jpa:
        show-sql: true
