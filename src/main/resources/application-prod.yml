# Production. Activate with SPRING_PROFILES_ACTIVE=prod.
# No files are imported and there are no defaults for hosts or credentials:
# set every variable below in the environment (or a secret manager).
#
# Note: only JWT_SECRET_KEY (must be a base64 key), MAIL_FROM (must be an email address) and
# FRONTEND_URL (must be a URL) stop startup when missing (AuthConfigProperties validates
# them). A missing DB_*, REDIS_* or MAIL_HOST/USERNAME/PASSWORD variable is passed on as the
# literal text "${NAME}" and only fails on first use. A startup check for this is planned
# (IMPROVEMENTS.md, M3, Phase 6).
spring:
    datasource:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_DATABASE}
        username: ${DB_USER}
        password: ${DB_PASSWORD}

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD}
            ssl:
                enabled: ${REDIS_SSL_ENABLED:false}

    mail:
        host: ${MAIL_HOST}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    # Refuse to send unencrypted: fail instead of falling back to plain text.
                    starttls:
                        required: true
                    # JavaMail waits forever by default; a slow mail server would hang the
                    # email threads and let queued emails pile up. Values in milliseconds.
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

    jpa:
        show-sql: false
