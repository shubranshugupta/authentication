# Production. Activate with SPRING_PROFILES_ACTIVE=prod.
# No files are imported and there are no defaults for hosts or credentials:
# set every variable below in the environment (or a secret manager).
#
# The startup stops, naming all of them, if one of the variables without a default is
# missing or empty (M3).
spring:
    datasource:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_DATABASE}
        username: ${DB_USER}
        password: ${DB_PASSWORD}

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD}
            ssl:
                enabled: ${REDIS_SSL_ENABLED:false}

    mail:
        host: ${MAIL_HOST}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    # Refuse to send unencrypted: fail instead of falling back to plain text.
                    starttls:
                        required: true
                    # JavaMail waits forever by default; a slow mail server would hang the
                    # email threads and let queued emails pile up. Values in milliseconds.
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

    jpa:
        show-sql: false

logging:
    structured:
        # One JSON object per line (Elastic Common Schema), with the request's trace id, for a
        # log collector such as CloudWatch, Loki or Elasticsearch.
        format:
            console: ecs

springdoc:
    # The API description and Swagger UI map out the whole API: off unless API_DOCS_ENABLED=true.
    api-docs:
        enabled: ${API_DOCS_ENABLED:false}
    swagger-ui:
        enabled: ${API_DOCS_ENABLED:false}

auth:
    # Checked before anything starts (RequiredSettings). Every variable above that has no
    # default belongs here.
    required-settings: >-
        DB_HOST, DB_DATABASE, DB_USER, DB_PASSWORD,
        REDIS_HOST, REDIS_PASSWORD,
        MAIL_FROM,
        JWT_SECRET_KEY, TOTP_ENCRYPTION_KEY, FRONTEND_URL
    # Only while MAIL_TRANSPORT is smtp (the default); with ses, AWS_REGION is checked instead.
    required-smtp-settings: MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD
