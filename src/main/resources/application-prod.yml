# Production. Activate with SPRING_PROFILES_ACTIVE=prod.
# No files are imported and there are no defaults for hosts or credentials:
# set every variable below in the environment (or a secret manager).
#
# Note: only settings read with @Value (JWT_SECRET_KEY, MAIL_USERNAME) stop startup when missing.
# A missing DB_* or REDIS_* variable is passed on as the literal text "${NAME}" and only fails
# on first use. A startup check for this is planned (IMPROVEMENTS.md, M3, Phase 6).
spring:
    datasource:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_DATABASE}
        username: ${DB_USER}
        password: ${DB_PASSWORD}

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD}
            ssl:
                enabled: ${REDIS_SSL_ENABLED:false}

    mail:
        host: ${MAIL_HOST}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}

    jpa:
        show-sql: false
