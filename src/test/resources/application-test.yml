# Integration tests (@ActiveProfiles("test")).
# MySQL and Redis come from Testcontainers (@ServiceConnection), so no connection
# settings are needed here, and nothing is read from ./env.properties.
auth:
    frontend-url: https://app.authcore.test/
    # Register as ADMIN (AdminUserTests and AdminActionTests use one each).
    admin-emails: first-admin@authcore.test, second-admin@authcore.test
    token:
        # Test-only key (base64 of "test-only-jwt-signing-key-for-authcore-integration-tests").
        secret-key: dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS1mb3ItYXV0aGNvcmUtaW50ZWdyYXRpb24tdGVzdHM=
    # Off: tests that expire something on purpose must not see it deleted. CleanupTests
    # runs the jobs itself.
    cleanup:
        cron: "-"
    mail:
        # JavaMailSender is a mock in most tests (nothing is sent); MailDeliveryTests
        # sends for real, to a Mailpit container.
        from: noreply@authcore.test
