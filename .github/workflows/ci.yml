# Builds and tests every push to main and every pull request (F4).
# The tests start MySQL, Redis and Mailpit with Testcontainers: GitHub's Ubuntu runners
# have Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run the tests
        run: ./mvnw -B verify

      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Only built, not pushed anywhere: it checks that the Dockerfile works.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: authcore:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
