# Looks for security problems in the code (F4). Results: the repository's Security tab.
# Free for public repositories; a private one needs GitHub Advanced Security.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # Mondays: new queries find new problems in old code too

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # Reads the sources without building them.
          build-mode: none

      - uses: github/codeql-action/analyze@v4
