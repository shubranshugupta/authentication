# Pull requests for new versions of the dependencies (F4). Security fixes come at once
# (turn on "Dependabot security updates" in the repository settings); the rest weekly.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for Spring Boot and springdoc, tested together: Spring Boot
      # manages most versions, and each springdoc line is made for one Spring Boot line
      # (3.1 for Boot 4.1, 3.2 for Boot 4.2).
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springdoc:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Only Java 25.x updates (security fixes). Java 25 is a long-term support version;
      # move to the next one on purpose, with pom.xml and CI, not through a bot PR.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
