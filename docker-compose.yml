# Local development services: MySQL, Redis and Mailpit.
#
# Start them with the same settings the app reads:
#   docker compose --env-file env.properties up -d
# Without --env-file, the defaults below are used; they match application-dev.yml.
#
# MySQL is published on 3307 by default, so it doesn't clash with a MySQL server
# already installed on 3306. Ports are bound to 127.0.0.1 only.
#
# The app itself can run here too, built from the Dockerfile (stop the one in your IDE
# first, it uses the same ports):
#   docker compose --env-file env.properties --profile app up -d --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-auth}
      MYSQL_USER: ${DB_USER:-auth}         # must not be "root"
      MYSQL_PASSWORD: ${DB_PASSWORD:-auth}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fake mail server: the app's emails land here instead of real inboxes.
  # Read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"   # SMTP: the app sends here
      - "127.0.0.1:8025:8025"   # web inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1        # accept any username/password (the app logs in to SMTP)
      MP_SMTP_AUTH_ALLOW_INSECURE: 1    # allow that login without TLS (local only)

  # The app from the Dockerfile; only with --profile app (see above).
  app:
    build: .
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # dev, not the image's prod: Mailpit has no TLS, which prod requires.
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-auth}
      DB_USER: ${DB_USER:-auth}
      DB_PASSWORD: ${DB_PASSWORD:-auth}
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in env.properties}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY in env.properties}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
    ports:
      - "127.0.0.1:8080:8080"   # the API
      - "127.0.0.1:8081:8081"   # health checks and metrics

volumes:
  mysql-data:
