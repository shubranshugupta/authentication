# Local development services: MySQL and Redis.
#
# Start them with the same settings the app reads:
#   docker compose --env-file env.properties up -d
# Without --env-file, the defaults below are used; they match application-dev.yml.
#
# MySQL is published on 3307 by default, so it doesn't clash with a MySQL server
# already installed on 3306. Ports are bound to 127.0.0.1 only.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-auth}
      MYSQL_USER: ${DB_USER:-auth}         # must not be "root"
      MYSQL_PASSWORD: ${DB_PASSWORD:-auth}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
